name: Postaviť APK
on:
  workflow_dispatch:
  push:
    paths: ["obal/**", ".github/workflows/apk.yml"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: obal } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: obal/android
      - uses: actions/upload-artifact@v4
        with:
          name: DPB-apk
          path: obal/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Zverejniť APK na stiahnutie
        working-directory: .
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp obal/android/app/build/outputs/apk/debug/app-debug.apk DPB.apk
          gh release delete apk-obal --yes --cleanup-tag || true
          gh release create apk-obal DPB.apk --target "$GITHUB_SHA" --title "DPB – Android APK" --notes "Posledná zostava Android obalu. Stiahni DPB.apk a nainštaluj."
